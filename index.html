<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#050d10"
    >

    <title>WARFRONT — 3D Tactical Command</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div id="loading">

        <div class="loading-content">

            <div class="game-logo">
                WARFRONT
            </div>

            <div class="game-subtitle">
                3D TACTICAL COMMAND
            </div>

            <div class="loading-line"></div>

            <div class="loading-bar">

                <div id="progress"></div>

            </div>

            <div id="loadText">
                Initializing battlefield...
            </div>

        </div>

    </div>


    <!-- =====================================================
         THREE.JS CANVAS
         main.js will create the 3D battlefield
    ====================================================== -->


    <!-- =====================================================
         GAME HUD
    ====================================================== -->

    <div id="hud">

        <!-- TOP HEADER -->

        <header>

            <div>

                <div class="brand-title">
                    WARFRONT
                </div>

                <div class="brand-subtitle">
                    3D TACTICAL COMMAND
                </div>

            </div>


            <!-- RESOURCES -->

            <div class="resources">

                <span>
                    💰
                    <span id="money">
                        11500
                    </span>
                </span>

                <span>
                    ⛽
                    <span id="fuel">
                        1520
                    </span>
                </span>

                <span>
                    ⭐
                    <span id="score">
                        5
                    </span>
                </span>

            </div>

        </header>


        <!-- =================================================
             MISSION
        ================================================== -->

        <div id="mission">

            <strong>
                🎯 CURRENT MISSION
            </strong>

            <br>

            <span>
                Destroy enemy forces
            </span>

        </div>


        <!-- =================================================
             MINIMAP
        ================================================== -->

        <div id="minimap">

            <div class="map-grid"></div>

            <div class="player-marker"></div>

            <div class="enemy-marker"></div>

        </div>


        <!-- =================================================
             INFORMATION PANEL
        ================================================== -->

        <div id="info">

            Select a unit to begin.

        </div>


        <!-- =================================================
             EXTRA BATTLE STATUS
        ================================================== -->

        <div id="battleStatus">

            <span>
                ALLIES:
                <b id="allyCount">
                    5
                </b>
            </span>

            <span>
                ENEMIES:
                <b id="enemyCount">
                    5
                </b>
            </span>

        </div>


        <!-- =================================================
             MAIN CONTROLS
        ================================================== -->

        <div id="controls">

            <button
                id="attack"
                type="button"
            >
                ⚔ ATTACK
            </button>


            <button
                id="air"
                type="button"
            >
                ✈ AIR STRIKE
            </button>


            <button
                id="defend"
                type="button"
            >
                🛡 DEFEND
            </button>


            <button
                id="reset"
                type="button"
            >
                🎯 CAMERA
            </button>

        </div>

    </div>


    <!-- =====================================================
         MOBILE TOUCH CONTROL
         main.js creates the actual joystick.
    ====================================================== -->


    <!-- =====================================================
         GAME SCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/main.js">
    </script>

</body>

</html>
