<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>WARFRONT 3D</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= LOADING SCREEN ================= -->

  <div id="loading">

    <div class="loading-content">

      <div class="game-logo">
        WARFRONT
      </div>

      <div class="game-subtitle">
        3D TACTICAL COMMAND
      </div>

      <div class="loading-line"></div>

      <div class="loading-bar">
        <div id="progress"></div>
      </div>

      <div id="loadText">
        Initializing battlefield...
      </div>

    </div>

  </div>


  <!-- ================= GAME HUD ================= -->

  <div id="hud">

    <!-- TOP BAR -->

    <header>

      <div class="brand">

        <div class="brand-title">
          WARFRONT
        </div>

        <div class="brand-subtitle">
          TACTICAL COMMAND
        </div>

      </div>


      <div class="resources">

        <span>
          💰 <b id="money">5000</b>
        </span>

        <span>
          ⛽ <b id="fuel">1000</b>
        </span>

        <span>
          🔩 <b id="metal">2000</b>
        </span>

      </div>

    </header>


    <!-- MISSION -->

    <div id="mission">
      🎯 CAPTURE THE ENEMY HEADQUARTERS
    </div>


    <!-- INFORMATION -->

    <div id="info">
      Select a unit, then tap/click the battlefield to move it.
    </div>


    <!-- MINIMAP -->

    <div id="minimap">

      <div class="map-grid"></div>

      <div class="player-marker"></div>

      <div class="enemy-marker"></div>

    </div>


    <!-- BOTTOM CONTROLS -->

    <div id="controls">

      <button id="attack">
        ⚔ ATTACK
      </button>

      <button id="air">
        ✈ AIR STRIKE
      </button>

      <button id="defend">
        🛡 DEFEND
      </button>

      <button id="reset">
        ⌾ RESET CAMERA
      </button>

    </div>

  </div>


  <!-- ================= THREE.JS GAME ================= -->

  <script type="module" src="js/main.js"></script>

</body>
</html>
