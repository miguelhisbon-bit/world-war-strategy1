<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WARFRONT — 3D Tactical Command</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOADING SCREEN -->

    <div id="loading">

        <div class="loading-box">

            <div class="logo">
                WARFRONT
            </div>

            <div class="subtitle">
                3D TACTICAL COMMAND
            </div>

            <div class="loading-line">
                <div id="progress"></div>
            </div>

            <div id="loadText">
                Initializing battlefield...
            </div>

        </div>

    </div>


    <!-- GAME UI -->

    <div id="ui">

        <div class="topbar">

            <div>
                <b>WARFRONT</b>
                <span>TACTICAL COMMAND</span>
            </div>

            <div class="resources">

                💰 <span id="money">10000</span>

                ⛽ <span id="fuel">1000</span>

                🏆 <span id="score">0</span>

            </div>

        </div>


        <div class="mission">

            <b>MISSION</b>

            <div id="mission">
                Destroy the enemy forces
            </div>

        </div>


        <div id="info">
            Select a unit
        </div>


        <div class="controls">

            <button id="attack">
                ⚔ ATTACK
            </button>

            <button id="air">
                ✈ AIR STRIKE
            </button>

            <button id="defend">
                🛡 DEFEND
            </button>

            <button id="reset">
                🎯 RESET CAMERA
            </button>

        </div>

    </div>


    <!-- IMPORTANT -->

    <script
        type="module"
        src="js/main.js">
    </script>

</body>
</html>
