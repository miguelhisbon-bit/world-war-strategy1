<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <title>WORLD WAR: BATTLEFIELD</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loadingScreen">

    <div class="loadingContent">

        <div class="warLogo">
            WORLD WAR
        </div>

        <div class="subLogo">
            BATTLEFIELD COMMAND
        </div>

        <div class="loadingRadar">
            <div class="radarCircle"></div>
            <div class="radarLine"></div>
        </div>

        <div class="loadingText">
            INITIALIZING BATTLEFIELD...
        </div>

        <div class="loadingBar">
            <div id="loadingProgress"></div>
        </div>

        <div id="loadingPercent">
            0%
        </div>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <canvas id="gameCanvas"></canvas>


    <!-- TOP HUD -->

    <div id="topHUD">

        <div class="resourceBox">
            <span>💰</span>
            <span id="money">5000</span>
        </div>

        <div class="resourceBox">
            <span>⚡</span>
            <span id="energy">100</span>
        </div>

        <div class="resourceBox">
            <span>🏆</span>
            <span id="score">0</span>
        </div>

        <div class="objective">
            OBJECTIVE:
            <b id="objectiveText">CAPTURE THE ENEMY BASE</b>
        </div>

    </div>


    <!-- UNIT INFO -->

    <div id="unitInfo" class="hidden">

        <div class="unitHeader">
            <span id="selectedIcon">🪖</span>

            <div>
                <div id="selectedName">
                    Infantry
                </div>

                <small id="selectedType">
                    SOLDIER
                </small>
            </div>

            <button id="closeUnit">×</button>
        </div>

        <div class="hpContainer">

            <div class="hpLabel">
                HP
                <span id="selectedHPText">100/100</span>
            </div>

            <div class="hpBar">
                <div id="selectedHP"></div>
            </div>

        </div>

        <div class="unitStats">

            <div>
                <span>⚔</span>
                <b id="attackStat">15</b>
            </div>

            <div>
                <span>🛡</span>
                <b id="defenseStat">10</b>
            </div>

            <div>
                <span>⚡</span>
                <b id="speedStat">2</b>
            </div>

        </div>

    </div>


    <!-- MOBILE CAMERA CONTROLS -->

    <div id="cameraControls">

        <button id="camUp">▲</button>

        <div>
            <button id="camLeft">◀</button>
            <button id="camDown">▼</button>
            <button id="camRight">▶</button>
        </div>

    </div>


    <!-- RIGHT SIDE CONTROLS -->

    <div id="actionControls">

        <button id="attackButton" class="actionButton attack">
            🔥
            <span>ATTACK</span>
        </button>

        <button id="bombButton" class="actionButton bomb">
            💣
            <span>BOMB</span>
        </button>

        <button id="moveButton" class="actionButton move">
            🚩
            <span>MOVE</span>
        </button>

    </div>


    <!-- UNIT PRODUCTION -->

    <div id="productionPanel">

        <button class="produce infantry"
                data-unit="infantry">
            🪖
            <small>INFANTRY</small>
            <b>$500</b>
        </button>

        <button class="produce tank"
                data-unit="tank">
            🛡️
            <small>TANK</small>
            <b>$1500</b>
        </button>

        <button class="produce artillery"
                data-unit="artillery">
            💥
            <small>ARTILLERY</small>
            <b>$2000</b>
        </button>

    </div>


    <!-- MINIMAP -->

    <div id="miniMap">

        <canvas id="miniCanvas"
                width="150"
                height="100">
        </canvas>

        <div class="mapLabel">
            TACTICAL MAP
        </div>

    </div>


    <!-- GAME CONTROLS -->

    <div id="bottomControls">

        <button id="pauseButton">
            ⏸
        </button>

        <button id="speedButton">
            1x
        </button>

        <button id="resetButton">
            ↻
        </button>

    </div>


    <!-- MESSAGE -->

    <div id="gameMessage">
        <div id="messageTitle"></div>
        <div id="messageText"></div>
        <button id="messageButton">
            CONTINUE
        </button>
    </div>


    <!-- DAMAGE INDICATOR -->

    <div id="damageFlash"></div>


    <!-- CROSSHAIR -->

    <div id="crosshair">
        +
    </div>

</div>


<script src="js/main.js"></script>

</body>
</html>
